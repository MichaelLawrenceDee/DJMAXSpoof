name: Build WirewayAudioFix

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install lz4 xz

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup Legacy SDKs
        run: |
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks
          # Fix module maps for modern Apple Clang
          find $HOME/theos/sdks -name "module.map" -exec bash -c 'mv "$1" "${1%.map}.modulemap"' _ {} \;

      - name: Build Package
        run: |
          make clean package FINALPACKAGE=1

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WirewayAudioFix-DEB
          path: |
            **/packages/*.deb
            **/*.deb
