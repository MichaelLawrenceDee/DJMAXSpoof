name: Build All Tweaks

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          brew install lz4 xz ldid

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup Legacy SDKs
        run: |
          rm -rf $HOME/theos/sdks
          git clone --depth=1 https://github.com/theos/sdks.git $HOME/theos/sdks
          find $HOME/theos/sdks -name "module.map" -exec bash -c 'mv "$1" "${1%.map}.modulemap"' _ {} \;

      - name: Build DJMAXSpoof
        run: |
          if [ -d "DJMAXSpoof" ]; then
            cd DJMAXSpoof && make clean package FINALPACKAGE=1
          fi

      - name: Build WirewayAudioFix
        run: |
          if [ -d "WirewayAudioFix" ]; then
            cd WirewayAudioFix && make clean package FINALPACKAGE=1
          fi

      - name: Upload DEB Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tweaks-DEB-Bundle
          path: |
            **/packages/*.deb
            **/*.deb
